[package]
name = "lk-jwt-service"
version = "0.6.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Service for delegating authentication and delayed leave events for MatrixRTC on LiveKit"

[[bin]]
name = "lk-jwt-service"
path = "src/main.rs"

[[bin]]
name = "healthcheck"
path = "src/bin/healthcheck.rs"

[features]
# Enables `POST /appservice-ping`, which triggers an application-service ping
# against a caller-supplied `server_name`/`appservice_id`.
appservice-ping-trigger = []

[dependencies]
livekit-api = { version = "0.6", features = ["rustls-tls-native-roots"] }
livekit-protocol = "0.7"
# Must match livekit-protocol's prost version; the RoomService Twirp client
# in helper.rs encodes/decodes its message types directly.
prost = "0.12"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

axum = "0.8"
tower = { version = "0.5", features = ["util"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2", "query", "system-proxy"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }

chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
sha2 = "0.11"
subtle = "2"
base64 = "0.23"
data-encoding = "2"
url = "2"
http = "1"
httpdate = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rust-yaml = "1.1.0"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
jsonwebtoken = "10"
temp-env = "0.3"
http-body-util = "0.1"
rcgen = "0.14"
axum-server = { version = "0.8", features = ["tls-rustls"] }
