name: "Create draft release after tag"
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: mkdir build
      - name: Build static binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC: musl-gcc
      - run: cp target/${{ matrix.target }}/release/lk-jwt-service build/lk-jwt-service_linux_${{ matrix.arch }}
      - name: "Upload binary as artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-linux-${{ matrix.arch }}
          path: build/lk-jwt-service_linux_${{ matrix.arch }}
          if-no-files-found: error

  create-release:
    needs: ["build"]
    runs-on: ubuntu-latest
    steps:
      - name: "Extract version"
        run: echo "IMAGE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: "Fetch all binaries"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build
          pattern: build-*
          merge-multiple: true
      - name: "Create release"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ## Docker image

          The service is available as a Docker image from the [GitHub Container Registry](https://github.com/element-hq/lk-jwt-service/pkgs/container/lk-jwt-service).

          ```
          docker pull ghcr.io/element-hq/lk-jwt-service:__IMAGE_VERSION__
          ```

          ## Precompiled binaries

          The service is available as static precompiled binaries for amd64 and arm64 on linux attached to this release below.
          EOF
          sed -i "s/__IMAGE_VERSION__/$IMAGE_VERSION/" notes.md
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --notes-file notes.md \
            build/*
