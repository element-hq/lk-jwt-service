networks:
  e2e:

x-synapse-build: &synapse-build
  # Built from https://github.com/element-hq/synapse/pull/19977 while it is unmerged.
  image: lk-jwt-e2e-synapse:latest
  build:
    context: https://github.com/Johennes/synapse.git#johannes/outgoing-fed-proxy
    dockerfile: docker/Dockerfile

x-jwt-service-build: &jwt-service-build
  image: lk-jwt-e2e-jwt-service:latest
  build:
    context: ../..
    args:
      # The e2e suite exercises POST /appservice-ping to verify the
      # application service setup.
      CARGO_FEATURES: appservice-ping-trigger

services:
  synapse-a:
    <<: *synapse-build
    hostname: homeserver-a
    environment:
      - SYNAPSE_CONFIG_PATH=/config/homeserver.yaml
    volumes:
      - ./homeserver-a.yaml:/config/homeserver.yaml:ro
      - ./app-service-a.yaml:/config/app-service-a.yaml:ro
      - ./certs/synapse-a.e2e.test.crt:/config/tls.crt:ro
      - ./certs/synapse-a.e2e.test.key:/config/tls.key:ro
    ports:
      - "18008:8008"
    networks:
      e2e:
        # Lets synapse-b resolve and federate with this homeserver by its
        # configured server_name, without needing .well-known or SRV setup.
        aliases:
          - synapse-a.e2e.test

  synapse-b:
    <<: *synapse-build
    hostname: homeserver-b
    environment:
      - SYNAPSE_CONFIG_PATH=/config/homeserver.yaml
    volumes:
      - ./homeserver-b.yaml:/config/homeserver.yaml:ro
      - ./app-service-b.yaml:/config/app-service-b.yaml:ro
      - ./certs/synapse-b.e2e.test.crt:/config/tls.crt:ro
      - ./certs/synapse-b.e2e.test.key:/config/tls.key:ro
    ports:
      - "18009:8008"
    networks:
      e2e:
        aliases:
          - synapse-b.e2e.test

  livekit-a:
    image: livekit/livekit-server:latest
    hostname: livekit-a
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit-a.yaml:/etc/livekit.yaml:ro
    ports:
      - "17890:7880"
    networks:
      - e2e

  livekit-b:
    image: livekit/livekit-server:latest
    hostname: livekit-b
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit-b.yaml:/etc/livekit.yaml:ro
    ports:
      - "17891:7880"
    networks:
      - e2e

  jwt-service-a:
    <<: *jwt-service-build
    hostname: jwt-service-a
    environment:
      - LIVEKIT_URL=ws://livekit-a:7880
      - LIVEKIT_KEY=e2e_livekit_key_a
      - LIVEKIT_SECRET=e2e_livekit_secret_a_0123456789ab
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=synapse-a.e2e.test
      - LIVEKIT_AS_REGISTRATION_FILE=/etc/lk-jwt-service/app-service-a.yaml
      - LIVEKIT_HS_SERVER_NAME=synapse-a.e2e.test
      - LIVEKIT_CS_API_URL_OVERRIDES=synapse-a.e2e.test=http://synapse-a:8008,synapse-b.e2e.test=http://synapse-b:8008
    volumes:
      - ./app-service-a.yaml:/etc/lk-jwt-service/app-service-a.yaml:ro
    ports:
      - "18080:8080"
    depends_on:
      - synapse-a
      - livekit-a
    networks:
      - e2e

  jwt-service-b:
    <<: *jwt-service-build
    hostname: jwt-service-b
    environment:
      - LIVEKIT_URL=ws://livekit-b:7880
      - LIVEKIT_KEY=e2e_livekit_key_b
      - LIVEKIT_SECRET=e2e_livekit_secret_b_0123456789ab
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=synapse-b.e2e.test
      - LIVEKIT_AS_REGISTRATION_FILE=/etc/lk-jwt-service/app-service-b.yaml
      - LIVEKIT_HS_SERVER_NAME=synapse-b.e2e.test
      - LIVEKIT_CS_API_URL_OVERRIDES=synapse-b.e2e.test=http://synapse-b:8008,synapse-a.e2e.test=http://synapse-a:8008
    volumes:
      - ./app-service-b.yaml:/etc/lk-jwt-service/app-service-b.yaml:ro
    ports:
      - "18081:8080"
    depends_on:
      - synapse-b
      - livekit-b
    networks:
      - e2e
