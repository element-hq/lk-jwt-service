id: "lk-jwt-service"
as_token: "e2e_as_token_b"
hs_token: "e2e_hs_token_b"
sender_localpart: "_lk_jwt_service"
namespaces:
  users:
    - exclusive: false
      regex: ".*"
# Required for Synapse to call POST /_matrix/app/v1/ping on this service.
# This will also cause event traffic to be sent to the service, so shouldn't
# be used in production. For our tests this doesn't matter.
url: "http://jwt-service-b:8080"
# Enable membership look-ups via /is_joined.
io.element.msc4502.scopes: ["urn:matrix:client:io.element.msc4502:rooms:is_joined"]
# Route /_matrix/client/(v*|unstable/*)/rtc/livekit/* C-S and S-S requests to this
# service.
io.element.msc4512.proxy_prefix: "rtc/livekit"
io.element.msc4512.proxy_url: "http://jwt-service-b:8080"
